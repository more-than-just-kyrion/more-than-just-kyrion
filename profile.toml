# Single source of truth for the README, the header SVG and the Pages site.
# Edit this, then run:  python tools/build.py

handle = "more-than-just-kyrion"       # GitHub username (the repo must share it)
tagline = "friendly, probably."
status = "building an agentic linux desktop."
secret = "reading the source. good instinct."

# section order; built-ins: about now stack projects contact, anything else is a [block.*]
order = ["about", "whois", "now", "projects", "history", "private", "stack", "contact"]

about = """
showed up out of nowhere and fixed a stranger's broken installer in about an
hour. the original dev came back to merge it. that's usually where the
questions start.

security has been non-negotiable for me since late primary school. the
details stay private. that's the point.

linux, old games, and anything that looks locked. more when it's ready.
"""

now = [
  "nanoborealis: an agent that can't leave its box",
  "keeping old versions playable",
  "[redacted]",
]

interests = ["security", "linux", "reversing", "game-preservation"]

[stack]
languages = ["python", "c#"]
home = ["fedora atomic", "kde plasma"]

[[projects]]
name = "nanoborealis"
url = "https://github.com/more-than-just-kyrion/nanoborealis"
desc = "a linux desktop with an agent living inside it. writes, runs and fixes code, borrows your gpus, and can't reach your files or your network. by design."

[[projects]]
name = "NMSLegacyVersionInstaller"
url = "https://github.com/more-than-just-kyrion/NMSLegacyVersionInstaller"
desc = "older no man's sky builds, for legit steam owners. fixed in about an hour. merged upstream."

[block.whois]
cmd = "whois kyrion"
text = """
first seen    2025-02, out of nowhere
first move    fixed a stranger's installer in ~1h. merged upstream.
security      non-negotiable since late primary school
builds        things that stay contained
status        friendly, probably.
"""

[block.history]
cmd = "history | tail -n 6"
text = """
  1  git clone someone-elses/broken-installer
  2  # ~1 hour later
  3  git push                  # merged upstream
  4  git init nanoborealis
  5  chmod 700 ~
  6  ████████████████          # [redacted]
"""

[block.private]
cmd = "ls ~/private"
text = """
vitasink/  watchbridge/  ██████/
$ cat vitasink/README
cat: vitasink/README: Permission denied
$ sudo !!
nice try.
"""

[[contact]]
label = "github"
url = "https://github.com/more-than-just-kyrion"
